[project]
name = "visual-verify"
version = "0.1.0"
description = "Region-level verifiable evidence for question answering over documents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.26",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
store = ["sqlalchemy>=2.0", "alembic>=1.13"]
# PINNED EXACTLY, DO NOT RELAX. Three of four version combinations tried are
# broken, and the dangerous one fails SILENTLY: colpali-engine 0.3.17 with
# transformers 5.x randomly initializes the LoRA adapter and the projection
# head, which drops known-item retrieval top-1 from 1.00 to 0.125 while
# reporting only an informational table. torch and torchvision must move
# together or torchvision's compiled ops fail to load.
retrieval = [
    "colpali-engine==0.3.10",
    "transformers>=4.51,<4.52",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "qdrant-client>=1.12",
]

[project.scripts]
vvrag = "visual_verify.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_verify"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# presentation/build_deck.py is a standalone slide-generation script for the
# defence deck, not part of the package or its tests. Its aligned-semicolon
# layout tables and long verbatim quotes from the proposal are deliberate, and
# reformatting them to the library's conventions would only obscure them.
#
# docs/ holds planning prose. Ruff formats Python fenced in Markdown, which
# would rewrite code snippets quoted verbatim in those documents; they are a
# historical record of what was written, not code that runs.
extend-exclude = ["presentation", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic revision files are generated. Whether `sa` ends up used, and how long
# a rendered op call is, are not under our control, so hand-editing every new
# revision to satisfy the linter would be busywork.
"**/migrations/versions/*" = ["E501", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that build and install a wheel"]
