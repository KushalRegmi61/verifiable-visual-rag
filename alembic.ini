# Repo-root Alembic entry point.
#
# The real migration assets live inside the package, at
# src/visual_verify/migrations, so that they ship in the wheel and the installed
# `vvrag` console script can find them as package data. This file exists only so
# that `uv run alembic upgrade head` still works from a source checkout, which
# the README documents; it points at the same scripts the packaged CLI uses.
#
# The database URL is deliberately NOT set here. env.py overwrites it at runtime
# from Settings.from_env() (VVRAG_DB_URL, default sqlite:///data/index.db), so a
# literal left in this file would be silently ignored and would only mislead.

[alembic]
script_location = %(here)s/src/visual_verify/migrations
prepend_sys_path = .
path_separator = os

[post_write_hooks]

# Logging configuration, consumed by migrations/env.py via fileConfig. These
# sections are required: env.py calls fileConfig(config.config_file_name), which
# raises if the ini it was loaded from declares no loggers.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
